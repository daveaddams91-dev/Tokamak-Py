[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tokamak-py"
version = "1.0.0"
description = "High-performance N-body electromagnetic plasma confinement engine with symplectic Boris integration and Barnes-Hut spatial decomposition."
readme = "README.md"
authors = [{ name = "Raj" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "numba>=0.57.0",
    "pyqt6>=6.5.0",
    "pyqtgraph>=0.13.3",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[project.scripts]
tokamak-py = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
